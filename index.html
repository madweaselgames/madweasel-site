<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
        name="description"
        content="Discover Mad Weasel Games: Mud Rush, Feed The Cat, and Mike-Mike Dogfight."
    >

    <title>Mad Weasel Games</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background:
                radial-gradient(
                    ellipse at top,
                    rgba(255, 108, 0, 0.12),
                    transparent 55%
                ),
                #080808;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 820px;
            margin: auto;
            padding: 24px 20px 40px;
        }

        .logo {
            text-align: center;
            margin: 0 0 12px;
        }

        .logo img {
            display: block;
            width: min(260px, 75%);
            height: auto;
            margin: auto;
        }

        .tagline {
            text-align: center;
            color: #ff7b22;
            font-size: clamp(22px, 5vw, 32px);
            line-height: 1.2;
            margin: 0 0 48px;
            font-weight: 700;
        }

        /* Games are stacked vertically on every screen size. */
        .games {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 36px;
        }

        .game-card {
            --accent: #ff7b22;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.04),
                    transparent
                ),
                #141414;

            border: 1px solid #2a2a2a;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.3);

            transition:
                transform 0.2s ease,
                border-color 0.2s ease;
        }

        .game-card.mudrush {
            --accent: #ff7b22;
        }

        .game-card.feedthecat {
            --accent: #6cbaff;
        }

        .game-card.mikemike {
            --accent: #f4bf4f;
        }

        .game-card > img {
            width: 100%;
            height: auto;
            display: block;
        }

        .game-info {
            padding: 28px 24px 32px;
            text-align: center;
            border-top: 3px solid var(--accent);
        }

        .game-info h2 {
            margin: 0 0 12px;
            font-size: clamp(26px, 5vw, 36px);
            letter-spacing: -0.5px;
        }

        .store-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            max-width: 100%;
            margin-top: 10px;
            padding: 14px 24px;
            background: var(--accent);
            color: #101010;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 17px;
            transition: filter 0.2s ease;
        }

        .store-button:hover {
            filter: brightness(1.12);
        }

        .store-button:focus-visible {
            outline: 3px solid white;
            outline-offset: 5px;
        }

        .footer {
            text-align: center;
            margin-top: 64px;
            font-size: 14px;
            color: #999;
        }

        @media (hover: hover) {
            .game-card:hover {
                transform: translateY(-4px);
                border-color: var(--accent);
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px 16px 32px;
            }

            .tagline {
                margin-bottom: 32px;
            }

            .games {
                gap: 28px;
            }

            .game-info {
                padding: 24px 18px;
            }

            .store-button {
                width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .game-card,
            .store-button {
                transition: none;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <header>
            <div class="logo">
                <img src="logo.png" alt="Mad Weasel Games">
            </div>

            <h1 class="tagline">
                Indie games with big attitude
            </h1>
        </header>

        <main class="games" aria-label="Our games">

            <!-- Mud Rush -->
            <article class="game-card mudrush">
                <img
                    src="mudrush.jpg"
                    alt="Mud Rush off-road racing"
                >

                <div class="game-info">
                    <h2>Mud Rush</h2>

                    <a
                        class="store-button"
                        href="https://play.google.com/store/apps/details?id=com.madweasel.mudrush"
                        aria-label="Play Mud Rush on Google Play"
                    >
                        Play on Google Play
                    </a>
                </div>
            </article>

            <!-- Feed The Cat -->
            <article class="game-card feedthecat">
                <img
                    src="feedthecat.jpg"
                    alt="Feed The Cat"
                    loading="lazy"
                >

                <div class="game-info">
                    <h2>Feed The Cat</h2>

                    <a
                        class="store-button"
                        href="https://play.google.com/store/apps/details?id=com.Luxlupi.FeedTheCat"
                        aria-label="Play Feed The Cat on Google Play"
                    >
                        Play on Google Play
                    </a>
                </div>
            </article>

            <!-- Mike-Mike Dogfight -->
            <article class="game-card mikemike">
                <img
                    src="mikemike.jpg"
                    alt="Mike-Mike Dogfight"
                    loading="lazy"
                >

                <div class="game-info">
                    <h2>Mike-Mike Dogfight</h2>

                    <a
                        class="store-button"
                        href="https://play.google.com/store/apps/details?id=com.Luxlupi.MMDogfight"
                        aria-label="Play Mike-Mike Dogfight on Google Play"
                    >
                        Play on Google Play
                    </a>
                </div>
            </article>

        </main>

        <footer class="footer">
            © Mad Weasel Games
        </footer>

    </div>
</body>
</html>
